name: CD

on:
  workflow_run:
    workflows: [CI]
    types:
      - completed
    branches:
      - main
      - develop

  workflow_dispatch:


jobs:
  deploy:
    name: Deploy to AWS

    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: self-hosted

    env:
      AWS_PROFILE: Academy
      AWS_REGION: ap-southeast-1
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      S3_BUCKET: jewelcart-frontend-dhanu

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 👇 Add it here
      - name: Verify AWS Session
        run: |
          aws sts get-caller-identity

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-artifacts
          path: ./artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}

      - name: Ensure Artifact Directories
        run: |
          mkdir -p ./artifacts/frontend/dist
          mkdir -p ./artifacts/lambda-packages
          mkdir -p ./artifacts/coverage-reports
          mkdir -p ./artifacts/security-reports

      - name: Deploy Lambda Functions
        run: |
          chmod +x scripts/deploy-lambda.sh
          ./scripts/deploy-lambda.sh

      - name: Deploy Frontend
        run: |
          chmod +x scripts/deploy-frontend.sh
          ./scripts/deploy-frontend.sh

      - name: Verify Deployment
        run: |
          chmod +x scripts/verify-deployment.sh
          ./scripts/verify-deployment.sh

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Region: $AWS_REGION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend Bucket: $S3_BUCKET" >> "$GITHUB_STEP_SUMMARY"