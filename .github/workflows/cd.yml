name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy to AWS

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-southeast-1
      S3_BUCKET: jewelcart-frontend-dhanu
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      
      HEALTH_URL: https://fpgg90w2y8.execute-api.ap-southeast-1.amazonaws.com/health

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ap-southeast-1

      - name: Verify AWS Credentials
        run: aws sts get-caller-identity

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-artifacts
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}

      - name: Show Downloaded Files
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Top level:"
          ls -la

          echo ""
          echo "Find frontend:"
          find . -type d -name frontend

          echo ""
          echo "Find dist:"
          find . -type d -name dist

          echo ""
          echo "Find lambda-packages:"
          find . -type d -name lambda-packages

          echo ""
          echo "Repository tree:"
          find . -maxdepth 5 | sort

      - name: Deploy Lambda Functions
        run: |
          chmod +x scripts/deploy-lambda.sh
          ./scripts/deploy-lambda.sh

      - name: Debug Workspace
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository contents:"
          ls -R

          echo ""
          echo "Artifacts:"
          ls -R artifacts || true

      - name: Deploy Frontend to S3
        run: |
          chmod +x scripts/deploy-frontend.sh
          ./scripts/deploy-frontend.sh

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      - name: Verify Deployment
        run: |
          chmod +x scripts/verify-deployment.sh
          ./scripts/verify-deployment.sh

      - name: Deployment Summary
        if: always()
        run: |
          {
            echo "# 🚀 Deployment Summary"
            echo ""
            echo "- Lambda Functions: ✅ Updated"
            echo "- Frontend: ✅ Uploaded to S3"
            echo "- CloudFront: ✅ Cache Invalidated"
            echo "- Region: $AWS_REGION"
            echo "- Bucket: $S3_BUCKET"
          } >> "$GITHUB_STEP_SUMMARY"